name: Electric fireplace
entities:
  - entity: switch
    name: Power
    translation_only_key: device_power
    icon: mdi:power
    dps:
      - id: 1
        type: boolean
        name: switch

  - entity: switch
    name: Flame
    translation_only_key: flame
    icon: mdi:fire
    restore_on_turn_on:
      - flame_color
      - ember_bed_color
    dps:
      - id: 10
        type: boolean
        name: switch
      - id: 101
        type: string
        name: flame_color
      - id: 102
        type: string
        name: ember_bed_color

  # Alexa ignores standalone Matter ModeSelect endpoints. These two light
  # entities expose the real five-step controls as standard Matter dimmers,
  # while retaining the exact C*/F* choices as Home Assistant effects.
  - entity: light
    name: Flame
    translation_only_key: flame
    icon: mdi:fire
    dps:
      - id: 10
        type: boolean
        name: switch
      - id: 104
        type: string
        name: brightness
        mapping:
          - dps_val: L1
            value: 51
          - dps_val: L2
            value: 102
          - dps_val: L3
            value: 153
          - dps_val: L4
            value: 204
          - dps_val: L5
            value: 255
      - id: 101
        type: string
        name: effect
        mapping:
          - dps_val: C0
            value: Stufe 0
          - dps_val: C1
            value: Stufe 1
          - dps_val: C2
            value: Stufe 2
          - dps_val: C3
            value: Stufe 3
          - dps_val: C4
            value: Stufe 4
          - dps_val: C5
            value: Stufe 5

  - entity: light
    name: Ember bed
    translation_only_key: ember_bed
    icon: mdi:fire-circle
    dps:
      - id: 10
        type: boolean
        name: switch
      - id: 103
        type: string
        name: brightness
        mapping:
          - dps_val: "01"
            value: 51
          - dps_val: "02"
            value: 102
          - dps_val: "03"
            value: 153
          - dps_val: "04"
            value: 204
          - dps_val: "05"
            value: 255
      - id: 102
        type: string
        name: effect
        mapping:
          - dps_val: F0
            value: Stufe 0
          - dps_val: F1
            value: Stufe 1
          - dps_val: F2
            value: Stufe 2
          - dps_val: F3
            value: Stufe 3
          - dps_val: F4
            value: Stufe 4
          - dps_val: F5
            value: Stufe 5

  # A two-speed fan maps cleanly to Matter Fan Control, which Alexa supports.
  # Both controls share DP 4: OFF, LO (Stufe 1), HI (Stufe 2).
  - entity: fan
    name: Heating stage
    translation_key: heater_stage
    icon: mdi:radiator
    dps:
      - id: 4
        type: string
        name: switch
        mapping:
          - dps_val: "OFF"
            value: false
          - dps_val: LO
            value: true
          - dps_val: HI
            value: true
      - id: 4
        type: string
        name: speed
        mapping:
          - dps_val: "OFF"
            value: 0
            hidden: true
          - dps_val: LO
            value: 50
          - dps_val: HI
            value: 100

  - entity: select
    name: Operating mode
    translation_only_key: mode
    icon: mdi:radiator
    dps:
      - id: 4
        type: string
        name: option
        mapping:
          - dps_val: "OFF"
            value: "off"
          - dps_val: LO
            value: h1
          - dps_val: HI
            value: h2

  - entity: select
    name: Countdown
    translation_only_key: countdown
    icon: mdi:timer-outline
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: 1h
            value: 1_hour
          - dps_val: 2h
            value: 2_hours
          - dps_val: 3h
            value: 3_hours
          - dps_val: 4h
            value: 4_hours
          - dps_val: 5h
            value: 5_hours

  - entity: select
    name: Ember bed brightness
    translation_only_key: ember_bed_brightness
    icon: mdi:brightness-6
    category: config
    dps:
      - id: 103
        type: string
        name: option
        mapping:
          - dps_val: "01"
            value: Stufe 1
          - dps_val: "02"
            value: Stufe 2
          - dps_val: "03"
            value: Stufe 3
          - dps_val: "04"
            value: Stufe 4
          - dps_val: "05"
            value: Stufe 5

  - entity: select
