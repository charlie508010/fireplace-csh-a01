        unit: C
        class: measurement

  - entity: sensor
    name: Current temperature
    translation_only_key: current_temperature
    class: temperature
    dps:
      - id: 3
        name: sensor
        type: integer
        unit: C
        class: measurement

  - entity: climate
    translation_only_key: heater
    dps:
      - id: 4
        type: string
        name: hvac_mode
        mapping:
          - dps_val: "OFF"
            value: "off"
          - dps_val: LO
            value: heat
          - dps_val: HI
            value: heat
      - id: 4
        type: string
        name: preset_mode
        mapping:
          - dps_val: "OFF"
            value:
            hidden: true
          - dps_val: LO
            value: h1
          - dps_val: HI
            value: h2
      - id: 2
        type: integer
        name: temperature
        range:
          min: 0
          max: 37
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: temp_set_f
                range:
                  min: 32
                  max: 99
      - id: 3
        type: integer
        name: current_temperature
        mapping:
          - constraint: temperature_unit
            conditions:
              - dps_val: f
                value_redirect: cur_temp_f
      - id: 13
        type: string
        name: temperature_unit
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
      - id: 14
        type: integer
        name: temp_set_f
        range:
          min: 32
          max: 99
        hidden: true
      - id: 15
        type: integer
        name: cur_temp_f
        hidden: true

  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 13
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
